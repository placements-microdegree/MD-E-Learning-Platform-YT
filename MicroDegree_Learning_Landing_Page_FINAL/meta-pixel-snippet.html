<!-- Click and engagement tracking: paste just before </body> -->
<script>
(function () {
  if (!window.fbq) return;
  // Every Enroll Now button (header, hero, curriculum, get, offer card, sticky bar)
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-track="enroll"]');
    if (!a) return;
    fbq('track', 'InitiateCheckout', { value: 399, currency: 'INR', content_name: 'Premium Plan' });
    fbq('trackCustom', 'EnrollClick', { location: a.getAttribute('data-loc') });
  }, true);
  // "See full curriculum" opened
  document.querySelectorAll('[data-track="curriculum"]').forEach(function (d) {
    d.addEventListener('toggle', function () {
      if (d.open) fbq('track', 'ViewContent', { content_name: 'Full curriculum' });
    });
  });
})();
</script>
